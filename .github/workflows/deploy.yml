name: Deploy to GitHub Pages

on:
  # Deployment is an explicit release action after reviewing the readiness report.
  workflow_dispatch:

# GitHub Pages deployments need read access to the repo and write access to
# Pages itself; id-token is required for the official deploy-pages action to
# authenticate the deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Avoid two deployments racing each other; let an in-flight deploy finish
# rather than cancelling it, since GitHub Pages deployments aren't resumable.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0

      # Optional: set a repository variable named SITE_URL (Settings ->
      # Secrets and variables -> Actions -> Variables) to the site's real
      # published URL, e.g. https://<owner>.github.io/<repo>. Metadata,
      # sitemap.xml, robots.txt, and JSON-LD default to the verified
      # https://harshitteotia.github.io/Portfolio URL when unset.
      - name: Resolve site URL
        if: vars.SITE_URL != ''
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: printf 'NEXT_PUBLIC_SITE_URL=%s\n' "$SITE_URL" >> "$GITHUB_ENV"

      - name: Build static export
        run: npm run build
        # BASE_PATH override is optional — next.config.ts derives the
        # correct GitHub Pages base path from GITHUB_REPOSITORY (always
        # provided automatically) unless BASE_PATH is set here explicitly.

      - name: Verify production export
        run: npm run verify:export

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Browser and accessibility regression tests
        run: npm run test:e2e

      # GitHub Pages runs Jekyll by default, which ignores files/folders
      # starting with an underscore (e.g. Next's _next/ assets). This is a
      # build-output marker, not a repo file, so it isn't tracked by git.
      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages deployments need read access to the repo and write access to
# Pages itself; id-token is required for the official deploy-pages action to
# authenticate the deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Avoid two deployments racing each other; let an in-flight deploy finish
# rather than cancelling it, since GitHub Pages deployments aren't resumable.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # Optional: set a repository variable named SITE_URL (Settings ->
      # Secrets and variables -> Actions -> Variables) to the site's real
      # published URL, e.g. https://<owner>.github.io/<repo>. Metadata,
      # sitemap.xml, robots.txt, and JSON-LD all fall back to localhost if
      # this isn't set, rather than fabricating a URL.
      - name: Resolve site URL
        if: vars.SITE_URL != ''
        run: echo "NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL }}" >> "$GITHUB_ENV"

      - name: Build static export
        run: npm run build
        # BASE_PATH override is optional — next.config.ts derives the
        # correct GitHub Pages base path from GITHUB_REPOSITORY (always
        # provided automatically) unless BASE_PATH is set here explicitly.

      # GitHub Pages runs Jekyll by default, which ignores files/folders
      # starting with an underscore (e.g. Next's _next/ assets). This is a
      # build-output marker, not a repo file, so it isn't tracked by git.
      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
